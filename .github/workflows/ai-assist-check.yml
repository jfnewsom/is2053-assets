# Runs every AI Assist prompt through Claude, Gemini, and GitHub Models and
# flags answers that break the prompt's rules. See tools/ai_check/ai_check.py.
#
# Starts when a push to spring-2027 changes anything in tools/ai_check/
# (to test a lab, add or touch its line in tools/ai_check/labs.txt), or by
# hand from the Actions tab once this file is also on the default branch.
# Results: the run's Summary page, plus a downloadable "ai-check-results" zip.
name: AI Assist check

on:
  push:
    branches: [spring-2027]
    paths: ["tools/ai_check/**"]
  workflow_dispatch:
    inputs:
      labs:
        description: "Lab ids to test, space-separated (blank = tools/ai_check/labs.txt)"
        required: false
        default: ""

permissions:
  contents: read
  models: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the prompts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ai_check/ai_check.py ${{ github.event.inputs.labs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-check-results
          path: ai_check_results/
          retention-days: 90
