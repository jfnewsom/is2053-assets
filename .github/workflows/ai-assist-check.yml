# Runs every AI Assist prompt through Claude and Gemini (and OpenAI, if that
# secret is set) and flags answers that break the prompt's rules.
# See tools/ai_check/ai_check.py.
#
# Starts when a push to spring-2027 changes anything in tools/ai_check/ or a
# lab sheet's JSON (where the prompts live), or by hand from the Actions tab
# once this file is also on the default branch. Labs tested: tools/ai_check/labs.txt.
# Results: the run's Summary page, plus a downloadable "ai-check-results" zip.
name: AI Assist check

on:
  push:
    branches: [spring-2027]
    paths: ["tools/ai_check/**", "pages/labs/json/**"]
  workflow_dispatch:
    inputs:
      labs:
        description: "Lab ids to test, space-separated (blank = tools/ai_check/labs.txt)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the prompts
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/ai_check/ai_check.py ${{ github.event.inputs.labs }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-check-results
          path: ai_check_results/
          retention-days: 90
